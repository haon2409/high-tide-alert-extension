<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>High Tide Alert</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 400px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #e0f7fa 0%, #499f7b 100%);
      color: #333;
    }
    .date {
      font-weight: 700;
      margin-top: 16px;
      font-size: 16px;
      color: #0277bd;
    }
    .date-value { color: #0288d1; }
    .tide-chart {
      margin: 12px 0;
      background: #fff;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    #threshold-container,
    #threshold2-container,
    #hours-container {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 14px;
      background: rgba(255,255,255,0.92);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    #threshold-input,
    #threshold2-input {
      width: 56px;
      padding: 4px 6px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #threshold-input:focus,
    #threshold2-input:focus {
      border-color: #0288d1;
      outline: none;
    }
    #threshold-summary { color: #d32f2f; font-weight: 700; }
    #threshold2-summary { color: #ff8f00; font-weight: 700; }
    #hours-summary { color: #0288d1; font-weight: 700; }
    #hours-checkboxes {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }
    #hours-checkboxes label {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 3px;
      min-width: 42px;
    }
    #hours-checkboxes input[type="checkbox"] {
      accent-color: #0288d1;
    }
    button {
      background: #0288d1;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover { background: #0277bd; }
    #edit-btn {
      background: #fff;
      color: #0288d1;
      border: 1px solid #0288d1;
    }
    #edit-btn:hover { background: #e3f2fd; }
    #save-btn, #cancel-btn { display: none; }
    #cancel-btn { background: #757575; }
    #cancel-btn:hover { background: #616161; }
    #tide-info {
      max-height: 480px;
      overflow-y: auto;
      font-size: 13px;
    }
    #status {
      font-size: 13px;
      color: #555;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div id="threshold-container">
    <span>Ngưỡng đỏ (nguy hiểm):</span>
    <span id="threshold-summary"><span id="threshold-value">1,5</span> m</span>
    <input type="number" id="threshold-input" min="0" step="0.1" value="1.5" style="display:none" disabled>
    <button id="edit-btn" title="Chỉnh sửa">⚙️</button>
    <button id="save-btn">Lưu</button>
    <button id="cancel-btn">Hủy</button>
  </div>

  <div id="threshold2-container">
    <span>Ngưỡng vàng (cảnh báo):</span>
    <span id="threshold2-summary"><span id="threshold2-value">2,0</span> m</span>
    <input type="number" id="threshold2-input" min="0" step="0.1" value="2.0" style="display:none" disabled>
  </div>

  <div id="hours-container">
    <span>Giờ kiểm tra:</span>
    <span id="hours-summary"></span>
    <div id="hours-checkboxes"></div>
  </div>

  <div id="status"></div>
  <div id="tide-info"></div>

  <script src="chart.js"></script>
  <script src="chartjs-plugin-annotation.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
